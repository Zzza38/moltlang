name: Bug report
description: Report incorrect compiler behavior
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: program
    attributes:
      label: Minimal MoltLang program
      render: molt
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
